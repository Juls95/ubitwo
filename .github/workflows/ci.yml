# Verificación continua — docs/politica-de-dependencias.md §5.
#
# Las acciones se fijan por SHA de commit, no por etiqueta (regla 11): una etiqueta es mutable
# y una acción comprometida corre con las credenciales que tenga el job.
#
#   actions/checkout         v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   pnpm/action-setup        v6.1.1  73e46992e05b19abd31f2f3c20e0e7370d762115
#   actions/setup-node       v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
#   gitleaks/gitleaks-action v3.0.0  e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Construye la tesis simulada y el sitio: lo mismo que ejecuta Render.
      - run: pnpm build
        env:
          DATA_MODE: mock

  audit:
    # Una versión fijada y vulnerable sigue siendo vulnerable (regla 19).
    # Producción debe estar limpia; desarrollo solo admite las excepciones documentadas en pnpm-workspace.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm audit

  secrets:
    # .gitignore evita el error honesto; el escáner atrapa el secreto escrito a mano (regla 18).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
